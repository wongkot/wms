<form [formGroup]="selectionForm">
  <select class="select select-primary w-full" formControlName="option" (change)="onSelectionChanged()">
    @if (prefix()) {
      <option selected disabled>{{ prefix() }}</option>
    }
    @for (option of options(); track option.key) {
      <option [value]="option.key">{{ option.value }}</option>
    }
  </select>
</form>
