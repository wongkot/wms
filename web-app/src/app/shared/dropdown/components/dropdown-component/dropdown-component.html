<form class="h-full flex flex-row" [formGroup]="selectionForm">
  <select class="bg-dropdown-primary border border-dropdown-primary-border text-dropdown-primary-content text-sm rounded-lg block w-full p-2.5 border-r-dropdown-primary border-r-8"
    formControlName="option"
    (change)="onSelectionChanged()"
  >
    @for (option of options(); track option.key) {
      <option [value]="option.key">{{ option.value }}</option>
    }
  </select>
</form>
