<div class="flex flex-col sm:flex-row gap-4 items-center">
  <!-- Page size selection -->
  <div class="flex flex-row">
    <span class="text-sm text-table-header-primary-content flex items-center align-middle whitespace-nowrap mr-2">
      Items per page:
    </span>
    <select class="text-sm bg-pagination-primary text-pagination-primary-content hover:bg-pagination-primary-hover rounded-lg w-full px-2 h-8 border-r-transparent border-r-8"
      (change)="onPageSizeChange($event)"
    >
      @for (pageSize of pageSizes(); track $index) {
        <option [value]="pageSize">
          {{ pageSize }}
        </option>
      }
    </select>
  </div>

  <!-- Page info -->
  <div class="text-sm text-table-header-primary-content flex items-center align-middle">
    Page {{ selectedPage() }} of {{ totalPages() }}
  </div>

  <!-- Page navigation -->
  <div class="inline-flex">
    <button class="flex items-center justify-center px-3 h-8 text-sm font-medium text-pagination-primary-content cursor-pointer bg-pagination-primary rounded-s hover:bg-pagination-primary-hover hover:text-pagination-primary-content-hover disabled:hover:bg-pagination-primary disabled:text-pagination-primary-content disabled:cursor-not-allowed disabled:opacity-75"
     [disabled]="isFirstPage()" (click)="onFirstPageClick()"
    >
      <i class="bi bi-chevron-double-left"></i>
    </button>
    <button class="flex items-center justify-center px-3 h-8 text-sm font-medium text-pagination-primary-content cursor-pointer bg-pagination-primary border-0 border-s border-pagination-primary-border hover:bg-pagination-primary-hover hover:text-pagination-primary-content-hover disabled:hover:bg-pagination-primary disabled:text-pagination-primary-content disabled:cursor-not-allowed disabled:opacity-75"
      [disabled]="isFirstPage()" (click)="onPreviousPageClick()"
    >
      <i class="bi bi-chevron-left"></i>
    </button>
    <button class="flex items-center justify-center px-3 h-8 text-sm font-medium text-pagination-primary-content cursor-pointer bg-pagination-primary border-0 border-s border-pagination-primary-border hover:bg-pagination-primary-hover hover:text-pagination-primary-content-hover disabled:hover:bg-pagination-primary disabled:text-pagination-primary-content disabled:cursor-not-allowed disabled:opacity-75"
      [disabled]="isLastPage()" (click)="onNextPageClick()"
    >
      <i class="bi bi-chevron-right"></i>
    </button>
    <button class="flex items-center justify-center px-3 h-8 text-sm font-medium text-pagination-primary-content cursor-pointer bg-pagination-primary border-0 border-s border-pagination-primary-border rounded-e hover:bg-pagination-primary-hover hover:text-pagination-primary-content-hover disabled:hover:bg-pagination-primary disabled:text-pagination-primary-content disabled:cursor-not-allowed disabled:opacity-75"
     [disabled]="isLastPage()" (click)="onLastPageClick()"
    >
      <i class="bi bi-chevron-double-right"></i>
    </button>
  </div>
</div>
