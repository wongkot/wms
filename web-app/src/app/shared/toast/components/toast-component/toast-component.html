@if (toastService.show()) {
  <div class="toast toast-start cursor-pointer transition-opacity duration-1000"
       [class.opacity-0]="toastService.startFadeOut()"
       (click)="onClose()">
    <div [class]="'alert ' + toastService.toastType()">
      <span>{{ toastService.message() }}</span>
    </div>
  </div>
}
