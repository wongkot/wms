<!-- Navigation -->
<div class="flex flex-row justify-between">
  <app-breadcrumb [breadcrumbSections]="breadcrumbSections"></app-breadcrumb>
  <button class="btn btn-soft"
    (click)="onGoBack()">
    <i class="'bi bi-arrow-left mr-2"></i>
    Back
  </button>
</div>

<!-- Inventory warehouse map + detail information -->
@if (stateService.isFetchingData()) {
  <div class="mx-auto bg-base-100 shadow-md rounded-box border border-base-content/10 p-6 mt-4">
    <div class="flex flex-row justify-center py-5">
      <span class="loading loading-spinner loading-md mr-2"></span>
      Fetching inventory data
    </div>
  </div>
} @else if (stateService.errorMessage()) {
  <div class="flex flex-row justify-center py-5 text-error">
    <i class="bi bi-exclamation-circle-fill text-error mr-2"></i>
    {{ stateService.errorMessage() }}
  </div>
} @else {
  <div class="flex flex-col md:flex-row mt-4">
    <div class="w-0 h-0 md:h-[80vh] md:w-6/10">
      <app-warehouse-map
        [warehouseMapState]="stateService.warehouseMapState()"
        [selectedArea]="stateService.selectedArea()">
      </app-warehouse-map>
    </div>
    <div class="w-full h-full md:h-[80vh] md:w-4/10">
      <app-inventory-product-info
        [inventoryProductInfo]="stateService.inventoryProduct()">
      </app-inventory-product-info>
    </div>
  </div>
}

<!-- Inventory operation (side bar) -->
<app-inventory-operations></app-inventory-operations>
