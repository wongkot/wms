<div class="flex flex-col md:flex-row md:items-center md:justify-between">
  <div class="flex flex-col md:flex-row md:items-center gap-4">
    <app-search-bar (textChanged)="onSearchTermChanged($event)"></app-search-bar>
    <app-dropdown prefix="Choose category" [options]="productCategories" (selectionChanged)="onSearchCategoryChanged($event)"></app-dropdown>
  </div>
  <div class="flex flex-row mt-4 gap-4 justify-end md:mt-0">
    <app-button-icon text="Inbound" iconClass="bi-box-arrow-in-down" (click)="onInboundInventory()"></app-button-icon>
  </div>
</div>
<div class="md:h-[75vh] mt-4">
  <app-table
    [tableConfig]="tableConfig"
    [dataSource]="stateService.displayInventoryProducts().items"
    [sortState]="stateService.currentSortState()"
    (sortStateChange)="onSortChanged($event)"
    (viewDetailClick)="onViewInventoryProductDetail($event)">
  </app-table>
</div>
<div class="mt-4">
  <app-pagination
    [selectedPage]="stateService.selectedPage()"
    [selectedPageSize]="stateService.selectedPageSize()"
    [totalItems]="stateService.displayInventoryProducts().totalItems"
    (pageSizeChange)="onPageSizeChanged($event)"
    (toFirstPageClick)="onFirstPageClick($event)"
    (toPreviousPageClick)="onPreviousPageClick($event)"
    (toNextPageClick)="onNextPageClick($event)"
    (toLastPageClick)="onLastPageClick($event)">
  </app-pagination>
</div>
