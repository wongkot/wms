<div class="flex flex-col md:flex-row md:items-center">
  <app-search-bar (textChanged)="onSearchTermChanged($event)"></app-search-bar>
</div>
<div class="md:h-[75vh] mt-4">
  <app-table
  [tableConfig]="tableConfig"
  [dataSource]="stateService.displayProducts().items"></app-table>
</div>
<div class="mt-3">
  <app-pagination
    [selectedPage]="stateService.selectedPage()"
    [selectedPageSize]="stateService.selectedPageSize()"
    [totalItems]="stateService.displayProducts().totalItems"
    (pageSizeChange)="onPageSizeChanged($event)"
    (toFirstPageClick)="onFirstPageClick($event)"
    (toPreviousPageClick)="onPreviousPageClick($event)"
    (toNextPageClick)="onNextPageClick($event)"
    (toLastPageClick)="onLastPageClick($event)">
  </app-pagination>
</div>
